services:
  - type: web
    name: docegestao-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASS
        value: Doce@2025
      - key: DATA_DIR
        value: /tmp
